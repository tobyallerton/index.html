<title>Two-Up Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column; sticky person switch + section tabs; cards only for meals/sessions */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#142030; --muted:#5B6878; --line:#D3DAE2;
  --p1:#2459E0; --p1-soft:#E2EAFD; --p2:#D2386E; --p2-soft:#FBE3EC;
  --good:#1E8A4C; --warn:#B86E00; --bad:#C0392B;
  --accent:var(--p1); --accent-soft:var(--p1-soft);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#17202A; --sunk:#0B1016; --ink:#E6ECF2; --muted:#93A1B1; --line:#283442;
  --p1:#6C95FF; --p1-soft:#1A2848; --p2:#FF6F9E; --p2-soft:#3A1A27;
  --good:#4CC17E; --warn:#F0A73A; --bad:#FF7A6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --sunk:#0B1016; --ink:#E6ECF2; --muted:#93A1B1; --line:#283442;
  --p1:#6C95FF; --p1-soft:#1A2848; --p2:#FF6F9E; --p2-soft:#3A1A27;
  --good:#4CC17E; --warn:#F0A73A; --bad:#FF7A6B; color-scheme:dark}
body.who-p2{--accent:var(--p2);--accent-soft:var(--p2-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:30px;font-weight:800;text-transform:uppercase}
h2{font-size:24px;font-weight:700;text-transform:uppercase}
h3{font-size:19px;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button,.btn{font:600 14px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.55;cursor:default}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{font-size:12px;color:var(--muted)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.who button{display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:10px 12px;text-align:left}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
.who button[aria-pressed="true"].p1{border-color:var(--p1);background:var(--p1-soft)}
.who button[aria-pressed="true"].p2{border-color:var(--p2);background:var(--p2-soft)}
.who .nm{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1}
.who .sub{font-size:12px;color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
section{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.targets div{background:var(--surface);padding:10px 12px}
.targets .v{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.targets .u{font-size:12px;color:var(--muted)}

.daypick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.daypick button{min-width:48px;padding:8px 6px;font-family:var(--f-display);font-size:16px;text-transform:uppercase}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.daypick button.today:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meal .slot{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.meal .macro{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.meal p{margin:0;color:var(--muted);font-size:14px}
.daytotal{font-size:13px;color:var(--muted);text-align:right}

table.ex{width:100%;border-collapse:collapse;font-size:14px}
table.ex th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.ex td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.ex td.n{font-family:var(--f-num);white-space:nowrap}
table.ex tr:last-child td{border-bottom:0}
table.ex .note{display:block;font-size:12px;color:var(--muted)}
.exbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.exbtns button,.exbtns a{padding:4px 10px;font-size:12px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.exbtns a.vid{background:var(--accent);border-color:var(--accent);color:#fff}
.exbtns button[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
table.ex td.howto{background:var(--sunk);border-radius:8px;padding:14px 16px}
.howto h4{margin:10px 0 4px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.howto h4:first-child{margin-top:0}
.howto ol,.howto ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.howto p{margin:0}
.howto .vids{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tablewrap{overflow-x:auto}
.session.done{border-color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--good)}

.coachnote{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.coachnote p{margin:0 0 6px}
ul.changes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
ul.shop{columns:2 180px;margin:0;padding-left:18px}

form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
textarea{min-height:76px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--accent)}
.rangeval{font-family:var(--f-num);font-size:13px;color:var(--accent)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--bad)}
.working{display:flex;align-items:center;gap:10px;font-size:14px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.chart svg{display:block;width:100%;height:auto}
.hist .card{gap:4px}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.kv b{font-family:var(--f-num);font-weight:500}
.disclaimer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.coachmsg{background:var(--accent-soft);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.coachmsg .from{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.coachmsg p{margin:0;font-size:16px;line-height:1.55;white-space:pre-wrap}
.coachmsg .ask{align-self:flex-start;margin-top:4px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 14px var(--f-display);flex:none}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:inherit}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .t{display:block;font-size:11px;opacity:.7;margin-top:4px}
.chatbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.chatbar form{display:flex;gap:8px}
.chatbar textarea{min-height:44px;height:44px;flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{white-space:nowrap;padding:6px 11px;font-size:13px;border-radius:999px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photo{display:flex;flex-direction:column;gap:4px;min-width:0}
.photo img,.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.photo .cap{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.photo button{padding:2px 8px;font-size:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:4px}
.compare figcaption{font-size:12px;color:var(--muted);text-align:center}
.posepick{display:flex;gap:6px}
.posepick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.upl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.upl label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.upl input{font-size:12px;padding:6px}
.shoplist{display:flex;flex-direction:column;gap:16px}
.aisle h3{font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item input{width:20px;height:20px;accent-color:var(--good)}
.item.got .nm{text-decoration:line-through;color:var(--muted)}
.item .nm{min-width:0}
.item .nm a{color:inherit;text-decoration:none;font-weight:500}
.item .nm small{display:block;color:var(--muted);font-size:12px}
.item .pr{font-family:var(--f-num);font-size:13px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.total .v{font-family:var(--f-num);font-size:24px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Two-Up Coach</h1>
      <small id="syncState">Connecting…</small>
    </div>
    <div class="who" role="group" aria-label="Whose plan">
      <button type="button" class="p1" data-who="p1" aria-pressed="true"><span class="dot" style="background:var(--p1)"></span><span><span class="nm" id="nm-p1">Person 1</span><br><span class="sub" id="sub-p1">Not set up</span></span></button>
      <button type="button" class="p2" data-who="p2" aria-pressed="false"><span class="dot" style="background:var(--p2)"></span><span><span class="nm" id="nm-p2">Person 2</span><br><span class="sub" id="sub-p2">Not set up</span></span></button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="coach" aria-selected="false">Coach</button>
      <button role="tab" data-tab="meals" aria-selected="false">Meals</button>
      <button role="tab" data-tab="shopping" aria-selected="false">Shopping</button>
      <button role="tab" data-tab="training" aria-selected="false">Training</button>
      <button role="tab" data-tab="checkin" aria-selected="false">Weekly check-in</button>
      <button role="tab" data-tab="progress" aria-selected="false">Progress &amp; photos</button>
      <button role="tab" data-tab="profile" aria-selected="false">Profile</button>
    </nav>
  </header>
  <main id="view" aria-live="polite"></main>
  <p class="disclaimer">Plans are written by Claude from what you enter here. They are general fitness guidance, not medical advice. Check with a doctor before big diet or training changes, especially with injuries, pregnancy or health conditions.</p>
</div>

<script>
(() => {
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const S = {
  who: "p1", tab: "today", day: DAYS[(new Date().getDay()+6)%7],
  people: {}, plans: {}, checkins: [], db: null, sample: undefined,
  loaded: false, busy: null, status: "", statusErr: false, stream: 0,
  chat: [], photos: [], daily: {}, howto: {}, howtoReq: {}, shopping: null, drafts: {}, openEx: null, assets: undefined, chatBusy: false, chatDraft: "", dailyReq: {}, pose: "front", confirmDel: null
};
try { const w = localStorage.getItem("tuc.who"); if (w === "p1" || w === "p2") S.who = w; } catch(e) {}

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const other = w => w === "p1" ? "p2" : "p1";
const nameOf = w => (S.people[w] && S.people[w].name) || (S.drafts && S.drafts[w] && S.drafts[w].name) || (w === "p1" ? "Person 1" : "Person 2");
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); } catch(e){ return iso; } };
const myCheckins = w => S.checkins.filter(c => c.who === w).sort((a,b) => a.date < b.date ? -1 : 1);

/* ---------- header ---------- */
function renderHeader(){
  document.body.className = "who-" + S.who;
  for (const w of ["p1","p2"]) {
    $("#nm-"+w).textContent = nameOf(w);
    const p = S.people[w], plan = S.plans[w];
    $("#sub-"+w).textContent = !p ? "Not set up" : plan ? `${plan.targets?.calories ?? "–"} kcal · week ${plan.week ?? 1}` : "No plan yet";
    document.querySelector(`.who [data-who="${w}"]`).setAttribute("aria-pressed", S.who === w);
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
}

/* ---------- views ---------- */
function render(){
  renderHeader();
  const v = $("#view");
  if (!S.loaded) { v.innerHTML = `<div class="working"><span class="spinner"></span>Loading your plans…</div>`; return; }
  if (!S.db) { v.innerHTML = `<div class="empty"><h3>Sign in to use the coach</h3><p>Profiles, plans and check-ins are saved for both of you, so this page needs you signed in to claude.ai. Open it from your own Claude account, or ask Toby to share it with you.</p></div>`; return; }
  const p = S.people[S.who];
  if (!p && S.tab !== "profile") { v.innerHTML = setupPrompt(); bind(); return; }
  const fn = {today:viewToday, coach:viewCoach, meals:viewMeals, shopping:viewShopping, training:viewTraining, checkin:viewCheckin, progress:viewProgress, profile:viewProfile}[S.tab];
  const ci = $("#chatInput"), draft = ci ? ci.value : null, foc = ci && document.activeElement === ci;
  v.innerHTML = fn();
  bind();
  const ni = $("#chatInput"); if (ni && draft != null) { ni.value = draft; if (foc) ni.focus(); }
  if (S.tab === "today") ensureDaily(S.who);
}

function setupPrompt(){
  return `<div class="empty">
    <h2>Set up ${esc(nameOf(S.who))}</h2>
    <p>Fill in a short profile: your body stats, goal, food preferences and the kit you can train with. Claude then writes a full week of meals and workouts. Each Sunday you do a check-in and the plan is adjusted for the week ahead.</p>
    <button class="primary" data-go="profile">Create profile</button>
  </div>`;
}

function noPlan(){
  return `<div class="empty"><h3>No plan yet</h3><p>Your profile is saved. Generate your first week and Claude will set calorie and protein targets, seven days of meals and your training sessions.${S.plans[other(S.who)] ? ` Dinners will match ${esc(nameOf(other(S.who)))}'s so you can cook once.` : ""}</p>
  ${genButton("Write my first plan")}</div>`;
}

function genButton(label){
  if (S.busy) return `<div class="working"><span class="spinner"></span>${esc(S.busy)}${S.stream ? ` <span class="num muted">${S.stream.toLocaleString()} chars</span>` : ""}</div>`;
  if (S.sample === null) return `<p class="status err">Claude isn't available in this view, so plans can't be generated here. Open the page in claude.ai while signed in.</p>`;
  return `<div class="row"><button class="primary" data-act="generate">${esc(label)}</button><span class="status ${S.statusErr?"err":""}">${esc(S.status)}</span></div>`;
}

function targetsBlock(t){
  if (!t) return "";
  const cell = (v,u,l) => v == null ? "" : `<div><div class="label">${l}</div><span class="v">${esc(v)}</span> <span class="u">${u}</span></div>`;
  return `<div class="targets">${cell(t.calories,"kcal","Calories")}${cell(t.protein,"g","Protein")}${cell(t.carbs,"g","Carbs")}${cell(t.fat,"g","Fat")}${cell(t.water_l,"L","Water")}${cell(t.steps?.toLocaleString?.() ?? t.steps,"","Steps")}</div>`;
}

function dayPicker(){
  const today = DAYS[(new Date().getDay()+6)%7];
  return `<div class="daypick" role="group" aria-label="Day">${DAYS.map(d => `<button data-day="${d}" aria-pressed="${S.day===d}" class="${d===today?"today":""}">${d}</button>`).join("")}</div>`;
}

function mealCards(plan, day){
  const d = (plan.meals||[]).find(x => x.day === day);
  if (!d) return `<p class="muted">No meals listed for ${day}.</p>`;
  let k=0,pr=0;
  const cards = d.meals.map(m => { k += +m.kcal||0; pr += +m.protein||0; return `<article class="card meal">
    <div class="spread"><span class="slot">${esc(m.slot)}</span><span class="macro">${esc(m.kcal)} kcal · ${esc(m.protein)}g P</span></div>
    <h3>${esc(m.name)}</h3>${m.mins||m.kit?`<span class="row" style="gap:6px">${m.mins?`<span class="chip">${esc(m.mins)} min</span>`:""}${m.kit?`<span class="chip">${esc(m.kit)}</span>`:""}</span>`:""}${m.items?`<p>${esc(m.items)}</p>`:""}${m.shared?`<span class="chip accent">Same dish as ${esc(nameOf(other(S.who)))}</span>`:""}</article>`; }).join("");
  return cards + `<div class="daytotal num">Day total ≈ ${k} kcal · ${pr}g protein</div>`;
}

function sessionCard(plan, w, i){
  const done = !!(plan.done && plan.done[i]);
  const rows = (w.exercises||[]).map((e,j) => { const key = `${i}-${j}`, open = S.openEx === key;
    return `<tr><td><b style="font-weight:600">${esc(e.name)}</b>${e.notes?`<span class="note">${esc(e.notes)}</span>`:""}

function chart(list, key, unit){
  const pts = list.filter(c => c[key] != null && c[key] !== "").map(c => ({d:c.date, v:+c[key]}));
  if (pts.length < 2) return "";
  const W=640,H=180,L=44,R=14,T=14,B=28;
  const vs = pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if (hi-lo<1){lo-=1;hi+=1;} const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
  const x = i => L + i*(W-L-R)/(pts.length-1), y = v => T + (hi-v)*(H-T-B)/(hi-lo);
  const ticks = [lo+(hi-lo)*.15, (lo+hi)/2, hi-(hi-lo)*.15];
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = line + `L${x(pts.length-1).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const last = pts[pts.length-1];
  return `<div class="chart"><div class="spread"><span class="label">${key==="weight"?"Weight":"Waist"} (${unit})</span><span class="num">${(last.v-pts[0].v>0?"+":"")}${(last.v-pts[0].v).toFixed(1)} ${unit} since start</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${key} over time">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${t.toFixed(1)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" fill-opacity=".1"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${esc(fmtDate(pts[0].d))}</text>
    <text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(fmtDate(last.d))}</text>
  </svg></div>`;
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.tab = b.dataset.go; S.status=""; render(); window.scrollTo(0,0); });
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { S.day = b.dataset.day; render(); });
  document.querySelectorAll("[data-act=generate]").forEach(b => b.onclick = () => { const r = S.retry && S.retry.who === S.who ? S.retry : null; S.retry = null; r ? generate(r.who, r.checkin, r.reason) : generate(S.who, null); });
  document.querySelectorAll("[data-act=regen]").forEach(b => b.onclick = () => generate(S.who, null, "Profile changed; rewrite the plan to match the updated profile."));
  document.querySelectorAll("[data-done]").forEach(cb => cb.onchange = () => toggleDone(+cb.dataset.done, cb.checked));
  document.querySelectorAll("input[type=range]").forEach(r => { const o = $("#"+r.id+"-v"); r.oninput = () => o.textContent = r.value; });
  const pf = $("#pfForm"); if (pf) pf.onsubmit = saveProfile;
  const cf = $("#chatForm"); if (cf) { cf.onsubmit = e => { e.preventDefault(); sendChat($("#chatInput").value); }; $("#chatInput").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); } }; }
  document.querySelectorAll("[data-say]").forEach(b => b.onclick = () => sendChat(b.dataset.say));
  document.querySelectorAll("[data-pose-pick]").forEach(b => b.onclick = () => { S.pose = b.dataset.posePick; render(); });
  document.querySelectorAll("[data-act=shopgen]").forEach(b => b.onclick = buildShopping);
  document.querySelectorAll("[data-act=shopcopy]").forEach(b => b.onclick = copyShop);
  document.querySelectorAll("[data-act=shopclear]").forEach(b => b.onclick = async () => { S.shopping.checked = {}; render(); try { await S.db.doc("shopping/current").set({...S.shopping, checked:{}}); } catch(e){ setStatus("Couldn't clear ticks.", true); } });
  document.querySelectorAll("[data-shop]").forEach(cb => cb.onchange = () => tickShop(cb.dataset.shop, cb.checked));
  document.querySelectorAll("[data-howto]").forEach(b => b.onclick = () => openHowto(b.dataset.howto, b.dataset.exname));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => deletePhoto(b.dataset.del));
  const pu = $("#photoAdd"); if (pu) pu.onchange = async () => { const f = pu.files[0]; if (!f) return; const pose = $("#photoPose").value; S.busy = "Uploading photo…"; render(); try { await uploadPhoto(S.who, todayISO(), pose, f); S.busy = null; setStatus("Photo saved."); } catch(err){ S.busy = null; setStatus("Upload failed: " + (err.message||err.code), true); } };
  const chatEnd = $("#chatEnd"); if (chatEnd && S.tab === "coach") chatEnd.scrollIntoView({block:"end"});
  const ci = $("#ciForm"); if (ci) ci.onsubmit = submitCheckin;
}
document.querySelectorAll(".who button").forEach(b => b.onclick = () => { S.who = b.dataset.who; S.status=""; try{localStorage.setItem("tuc.who",S.who);}catch(e){} render(); });
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.status=""; render(); });

function setStatus(msg, err){ S.status = msg; S.statusErr = !!err; render(); }

async function saveProfile(e){
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target).entries());
  fd.focus = [...e.target.querySelectorAll("input[name=focus]:checked")].map(i => i.value); fd.share_dinners = !!e.target.share_dinners.checked; fd.photos_to_coach = !!e.target.photos_to_coach.checked;
  const isNew = !S.people[S.who];
  fd.updatedAt = new Date().toISOString();
  try {
    await S.db.doc("people/"+S.who).set(fd);
    S.people[S.who] = fd;
    if (isNew || !S.plans[S.who]) { S.tab = "today"; render(); generate(S.who, null); }
    else setStatus("Profile saved.");
  } catch(err){ setStatus("Couldn't save: " + (err.message||err.code) + ". You may only have view access; ask Toby to share it with you as an editor.", true); }
}

async function toggleDone(i, val){
  const plan = S.plans[S.who]; if (!plan) return;
  const done = Object.assign({}, plan.done||{}, {[i]: val});
  plan.done = done; render();
  try { await S.db.doc("plans/"+S.who).update({done}); } catch(err){ setStatus("Couldn't save that tick.", true); }
}

async function submitCheckin(e){
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target).entries());
  for (const k of ["weight","waist","sessions","diet","energy","hunger","sleep","sleep_hours","steps"]) if (fd[k] !== "" && fd[k] != null) fd[k] = +fd[k]; else delete fd[k];
  fd.who = S.who; fd.planned = (S.plans[S.who]?.workouts||[]).length; fd.createdAt = new Date().toISOString();
  const files = [...e.target.querySelectorAll("input[type=file][data-pose]")].filter(i => i.files && i.files[0]).map(i => ({pose:i.dataset.pose, file:i.files[0]}));
  const blobs = [];
  if (files.length) {
    S.busy = "Uploading photos…"; render();
    for (const f of files) { try { const b = await uploadPhoto(S.who, fd.date, f.pose, f.file); blobs.push({pose:f.pose, blob:b}); } catch(err){ S.busy = null; setStatus("Photo upload failed (" + (err.code||err.message) + "). Your check-in wasn't submitted, try again.", true); return; } }
    S.busy = null;
  }
  fd.photos = files.map(f => f.pose);
  try {
    await S.db.doc(`checkins/${S.who}_${fd.date}`).set(fd);
    if (!S.checkins.find(c => c.who===S.who && c.date===fd.date)) S.checkins.push(fd);
  } catch(err){ setStatus("Couldn't save the check-in: " + (err.message||err.code), true); return; }
  if (fd.weight) { /* keep profile weight current */
    try { await S.db.doc("people/"+S.who).update({weight: fd.weight}); S.people[S.who].weight = fd.weight; } catch(e){}
  }
  generate(S.who, fd, null, blobs);
}

function slimPlan(plan){
  if (!plan) return null;
  return { week: plan.week, targets: plan.targets,
    meals: (plan.meals||[]).map(d => ({day:d.day, meals:d.meals.map(m => `${m.slot}: ${m.name} (${m.kcal} kcal, ${m.protein}g P)`)})),
    workouts: (plan.workouts||[]).map(w => ({day:w.day, title:w.title, exercises:(w.exercises||[]).map(e => `${e.name} ${e.sets}x${e.reps}`)})),
    coach_note: plan.coach_note };
}

function buildPrompt(who, checkin, reason){
  const p = S.people[who], plan = S.plans[who], hist = myCheckins(who).slice(-6);
  const partner = S.people[other(who)], partnerPlan = S.plans[other(who)];
  const shareDinners = p.share_dinners !== false && partner && partner.share_dinners !== false && partnerPlan;
  const partnerDinners = shareDinners ? (partnerPlan.meals||[]).map(d => { const m = d.meals.find(x => /dinner/i.test(x.slot)); return m ? `${d.day}: ${m.name}` : null; }).filter(Boolean) : [];
  const nextWeek = plan ? (plan.week||1) + 1 : 1;
  return `You are ${p.name}'s personal trainer and sports nutritionist: experienced, evidence-based, and invested in them. They are one half of a couple who train together. Coaching voice: ${STYLE[p.coach_style||"balanced"]}${p.why ? ` Their big why: "${p.why}".` : ""} Be practical and specific. FOOD STYLE FOR THIS HOUSEHOLD: they shop at Sainsbury's on a budget, so use ingredients Sainsbury's stocks, favouring own-brand and good-value staples (frozen veg, tins, eggs, chicken thighs, mince, rice pouches, wraps, Greek-style/lactose-free yoghurt as needed). Meals must be QUICK and EASY with MINIMAL WASHING UP: most under 20 minutes, none over 30; one pan, one tray, air fryer, microwave or no-cook; batch-cook once and reuse as leftovers; few ingredients per meal.

CLIENT PROFILE
${JSON.stringify(p, null, 1)}

${plan ? `CURRENT PLAN (week ${plan.week||1})\n${JSON.stringify(slimPlan(plan))}\n` : "This is the client's FIRST plan.\n"}
${hist.length ? `CHECK-IN HISTORY (oldest first)\n${JSON.stringify(hist.map(c => { const {createdAt, who, ...rest} = c; return rest; }))}\n` : ""}
${checkin ? `THIS WEEK'S CHECK-IN (just submitted): ${JSON.stringify(checkin)}\n` : ""}
${reason ? `REASON FOR THIS REWRITE: ${reason}\n` : ""}
${partnerDinners.length ? `COUPLE: they cook dinner together. Use these SAME dinner dishes on the same days as ${partner.name}'s plan, with portions and sides adjusted to this client's targets, and mark them "shared": true:\n${partnerDinners.join("\n")}\n` : partner ? `COUPLE: ${partner.name} (${partner.goal}) eats with them. Pick dinners that suit both of them; mark dinners "shared": true.\n` : ""}
RULES
- Work out calories from Mifflin-St Jeor with a sensible activity factor, then apply the goal. Fat loss: deficit aiming for about 0.5–1% bodyweight per week. Never go below 1200 kcal for women or 1500 kcal for men. Muscle gain: small surplus (about 200–300 kcal).
- Protein about 1.6–2.2 g per kg bodyweight. Round targets to sensible numbers.
- If there is check-in data, ADJUST, don't start over: compare weight trend to goal (use the average of recent weigh-ins, ignore one-off spikes), and adjust calories by 100–200 kcal only if the trend is off for 2+ weeks or hunger/energy is poor. Swap meals they disliked or struggled with, keep ones that worked. Progress lifts that felt easy (more weight or reps), back off anything causing pain and offer a safe substitute. Account for anything coming up next week.
- Respect allergies and foods to avoid strictly. Keep prep realistic for their time and budget, and keep each meal to one pan/tray where possible. Reuse ingredients across the week to keep shopping simple; leftovers for lunch are fine.
${p.goal === "tone" ? "- GOAL 'TONE UP': resistance training is the priority (not endless cardio), with a modest calorie deficit (or maintenance if already lean) and high protein, so they lose a little fat and build visible shape. Moderate reps (8–15), progressive overload, plus daily steps.\n" : ""}${(p.focus||[]).length ? `- FOCUS AREAS: ${p.focus.join(", ")}. Give these extra weekly volume while keeping the programme balanced full-body.${p.focus.includes("glutes") ? " Glutes: train them in most sessions with hip thrusts or glute bridges, Romanian deadlifts, Bulgarian split squats/lunges, step-ups, cable or band kickbacks and abductions; progress the load." : ""}${p.focus.includes("abs") ? " Abs & core: finish 2–3 sessions with 2–3 core moves (dead bugs, planks/side planks, hanging or lying leg raises, cable crunches, Pallof press). In coach_note or nutrition_notes, be honest that visible abs come mainly from lower body fat, so nutrition matters as much as crunches." : ""}\n` : ""}- Exactly ${p.days || 3} training sessions of about ${p.session || 45} minutes, using only their equipment (${p.equipment}${p.kit ? ": " + p.kit : ""}).${/kettlebell/.test(p.equipment||"") ? " HOME KETTLEBELL WORKOUTS ONLY: kettlebells, bodyweight and the floor. No barbell, bench, cables, machines or pull-up bar. Use kettlebell staples (goblet squat, swings, deadlifts and RDLs, rows, floor press, clean & press, lunges, hip thrusts, carries, halos) and say which bell to use (lighter/heavier). Progress with reps, tempo, pauses, unilateral work and moving up a bell." : ""} Spread across the week with rest days. Include progressive overload and sets/reps/rest. Beginners: simple compound movements.
- ${p.meals_per_day || 4} meals/snacks per day; each day's total should be within about 5% of the calorie target.
${p.breakfast === "no" ? "- They do NOT eat breakfast. No breakfast slot at all: the first meal is lunch. Fit the day's calories and protein into lunch, an afternoon snack and dinner (an evening snack is fine). Don't lecture them about breakfast.\n" : p.breakfast === "light" ? "- Breakfast must be very light or a drink only (e.g. a protein coffee, a smoothie, a yoghurt drink). No cooked breakfasts.\n" : ""}${p.appetite === "small" ? "- They have a SMALL appetite and don't enjoy eating much. Use small, easy-to-eat, calorie- and protein-dense meals, not big plates; things they can graze on; drinkable options (shakes, smoothies) count; tasty over 'clean'. Don't set an aggressive deficit (if fat loss, keep it gentle) and make sure they still reach the calorie floor and protein target; protein can sit at the lower end (about 1.6 g/kg) if hitting it is a struggle. Check in on whether they are eating enough.\n" : p.appetite === "big" ? "- They have a BIG appetite: prioritise high-volume, filling foods (lean protein, veg, potatoes, fruit, soups) so the targets feel like plenty.\n" : ""}
- Keep text short: meal "items" is one line listing ingredients with amounts; exercise "notes" a few words or empty.

Reply with ONLY a JSON object of this shape:
{"week": ${nextWeek},
 "targets": {"calories": number, "protein": number, "carbs": number, "fat": number, "water_l": number, "steps": number},
 "review": "${!checkin && reason && plan ? "2–3 sentences telling them what you changed mid-week and why, in your coaching voice" : checkin ? "Your PT review of their week, written directly to them, 4–7 sentences: call out specific wins with numbers, be honest about what slipped and why it matters, connect it to their why, and finish with a clear challenge for next week" : "A short welcome from their new coach, 3–4 sentences: what you're going to do together and what you expect from them"}",
 "coach_note": "1–2 sentences: this week's single focus, in second person",
 "changes": ["each change from last week and why, short; for a first plan, explain how targets were set"],
 "nutrition_notes": "one or two practical tips",
 "training_notes": "one or two tips on progression/form",
 "rest_day_tip": "one line",
 "meals": [{"day":"Mon","meals":[{"slot":"Breakfast","name":"","items":"","kcal":0,"protein":0,"mins":15,"kit":"one pan | tray bake | air fryer | microwave | no-cook | leftovers","shared":false}]}  ... all 7 days Mon..Sun],
 "workouts": [{"day":"Mon","title":"","focus":"","duration_min":0,"warmup":"","exercises":[{"name":"","sets":3,"reps":"8-10","rest":"90s","notes":""}],"cardio":""}],
 "shopping": []}  (leave shopping empty; a combined household list is built separately)`;
}

async function generate(who, checkin, reason, photoBlobs){
  if (S.busy) return;
  if (S.sample === undefined) { setStatus("Still connecting to Claude, try again in a moment.", true); return; }
  if (!S.sample) { setStatus("Claude isn't available in this view.", true); return; }
  S.busy = checkin ? "Claude is reading your check-in and writing next week…" : "Claude is writing your plan…";
  S.stream = 0; S.status = ""; render();
  let plan, images;
  if (photoBlobs && photoBlobs.length && S.people[who]?.photos_to_coach) {
    images = []; let desc = "";
    for (const pb of photoBlobs) { images.push(pb.blob); desc += `\n- Image ${images.length}: ${pb.pose} photo, this week`; }
    const firstFront = S.photos.filter(x => x.who===who && x.pose==="front" && x.date < (checkin?.date||"9")).sort((a,b)=>a.date<b.date?-1:1)[0];
    if (firstFront) { try { const r = await fetch("/_blob/"+firstFront.asset); if (r.ok) { images.push(await shrink(await r.blob(), 1024)); desc += `\n- Image ${images.length}: front photo from ${firstFront.date} (their starting point)`; } } catch(e){} }
    S.photoDesc = desc;
  } else S.photoDesc = "";
  try {
    const lim = images ? await S.sample.limits().catch(()=>null) : null;
    if (!lim?.images) images = undefined; else images = images.slice(0, lim.images.maxCount || 4);
    plan = await S.sample.json(buildPrompt(who, checkin, reason) + (images ? `\n\nPROGRESS PHOTOS are attached:${S.photoDesc}\nIn the review, comment briefly and kindly on visible changes (posture, shape, definition) without guessing body-fat numbers or criticising their body.` : ""), {
      modelTier: "complex", cache: false, images,
      onText: ({text}) => { const n = text.length; if (n - S.stream > 400) { S.stream = n; const w = document.querySelector(".working .num"); if (w) w.textContent = n.toLocaleString()+" chars"; else render(); } }
    });
    if (!plan || !Array.isArray(plan.meals) || !Array.isArray(plan.workouts)) throw {code:"invalid_json", message:"The plan came back incomplete."};
  } catch(err){
    S.busy = null; S.retry = {who, checkin, reason};
    const msg = err.code === "rate_limited" ? "You've hit a usage limit. Try again in a little while."
      : err.code === "not_granted" ? "Claude access was declined for this page. Allow it from the page's Permissions menu to generate plans."
      : err.code === "invalid_json" ? "The plan came back cut off or malformed. Press the button to try again."
      : "Couldn't generate the plan (" + (err.message || err.code || "unknown error") + ").";
    if (checkin) { S.tab = "checkin"; }
    setStatus(msg + (checkin ? " Your check-in is saved." : ""), true);
    if (checkin || !S.plans[who]) { const v=$("#view"); if (!v.querySelector("[data-act=generate]")) v.insertAdjacentHTML("afterbegin", `<div class="row"><button class="primary" data-act="generate">Try again</button></div>`); bind(); }
    return;
  }
  const old = S.plans[who];
  plan.who = who; plan.done = (old && reason) ? (old.done||{}) : {}; plan.createdAt = new Date().toISOString();
  plan.basedOn = checkin ? checkin.date : (reason ? "profile update" : "first plan");
  if (old && !reason) plan.week = (old.week||1) + 1; else if (old) plan.week = old.week || 1; else plan.week = 1;
  try {
    if (old) await S.db.doc(`planHistory/${who}_${(old.createdAt||Date.now()).toString().replace(/[^0-9]/g,"")}`).set(old);
    await S.db.doc("plans/"+who).set(plan);
    S.plans[who] = plan;
    if (plan.review) await addChat(who, "assistant", (checkin ? `Week ${plan.week-1} review\n\n` : "") + plan.review);
  } catch(err){ S.busy = null; setStatus("Plan written but couldn't be saved: " + (err.message||err.code), true); return; }
  S.busy = null; S.status = ""; S.tab = checkin ? "progress" : "today"; S.day = DAYS[(new Date().getDay()+6)%7];
  render(); window.scrollTo(0,0);
}

const STYLE = {

function checkinStreak(w){
  const l = myCheckins(w).map(c => new Date(c.date).getTime()).reverse(); if (!l.length) return 0;
  if (Date.now() - l[0] > 9*864e5) return 0;
  let n = 1; for (let i=1;i<l.length;i++){ if (l[i-1]-l[i] <= 9*864e5) n++; else break; } return n;
}
function coachContext(w){
  const p = S.people[w], plan = S.plans[w], today = DAYS[(new Date().getDay()+6)%7];
  const sess = (plan?.workouts||[]).map((x,i)=>({day:x.day,title:x.title,done:!!plan.done?.[i]}));
  const todayMeals = (plan?.meals||[]).find(d=>d.day===today);
  return `ABOUT ${p.name}: ${JSON.stringify({age:p.age,sex:p.sex,weight:p.weight,units:p.units,goal:p.goal,focus:p.focus,target:p.target,why:p.why,experience:p.experience,equipment:p.equipment,injuries:p.injuries,avoid:p.avoid,breakfast:p.breakfast,appetite:p.appetite,notes:p.notes})}
PARTNER: ${S.people[other(w)]?.name || "none set up"} (they train as a couple)
TODAY: ${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}
PLAN week ${plan?.week||"-"}: targets ${JSON.stringify(plan?.targets||{})}; this week's sessions ${JSON.stringify(sess)}; this week's focus: ${plan?.coach_note||""}
TODAY'S MEALS: ${todayMeals ? todayMeals.meals.map(m=>`${m.slot}: ${m.name}`).join("; ") : "n/a"}
RECENT CHECK-INS: ${JSON.stringify(myCheckins(w).slice(-3).map(({createdAt,who,...r})=>r))}
CHECK-IN STREAK: ${checkinStreak(w)} weeks`;
}

${coachContext(w)}

Write today's morning message to ${p.name}: 2–4 short sentences, plain text, no emoji spam (one at most), no greeting cliches. Reference something specific: today's session (or that it's a rest day and what to do instead), how many sessions they've done so far this week, a meal, a recent check-in detail, or their why. End with one concrete thing to do today. Reply with the message only.`, {modelTier:"quick", cache:false});

    ${S.status ? `<span class="status ${S.statusErr?"err":""}">${esc(S.status)}</span>` : ""}

async function sendChat(text){
  text = (text||"").trim(); if (!text || S.chatBusy || !S.sample) return;
  const w = S.who, p = S.people[w];
  const inp = $("#chatInput"); if (inp) inp.value = "";
  S.chatBusy = true; S.chatDraft = ""; S.status = "";
  try { await addChat(w, "user", text); } catch(err){ S.chatBusy = false; setStatus("Couldn't send: " + (err.message||err.code), true); return; }
  render();
  const hist = myChat(w).slice(-16).map(m => ({role:m.role, content:m.text}));
  while (hist.length && hist[0].role !== "user") hist.shift();
  const merged = []; for (const m of hist) { if (merged.length && merged[merged.length-1].role === m.role) merged[merged.length-1].content += "\n\n" + m.content; else merged.push({...m}); }
  merged[0].content = `[Coach briefing, not from the client]
You are ${p.name}'s personal trainer and nutrition coach in a chat app. Voice: ${STYLE[p.coach_style||"balanced"]}
Act like a real PT texting a client: short replies (usually 2–5 sentences), specific to their plan and data, motivating, accountable. Push them to train when it's just low motivation; tell them to rest when it's illness, real pain or exhaustion. For pain, give safe swaps and say to see a physio/doctor if it's sharp, persistent or swelling. Never give medical diagnoses. Plain text, no markdown headings.
If they need their plan changed (a schedule change, a food swap for the week, a new injury, travel), call the rewrite_plan tool with a clear reason, then tell them it's being updated.
${coachContext(w)}
[End briefing]

${merged[0].content}`;
  let rewrite = null;
  try {
    const {text: reply} = await S.sample(merged, {
      modelTier: "default", cache: false,
      onText: ({text}) => { S.chatDraft = text; const el = $("#chatStream"); if (el) el.textContent = text; },
      tools: [{ name: "rewrite_plan", description: "Rewrite this client's weekly meal and training plan. Use when they ask for or need a plan change.", inputSchema: {type:"object", properties:{reason:{type:"string", description:"What to change and why"}}, required:["reason"]}, execute: (inp) => { rewrite = inp.reason; return "Plan rewrite queued; it starts as soon as you finish replying."; } }]
    });
    await addChat(w, "assistant", reply.trim());
  } catch(err){
    setStatus(err.code === "rate_limited" ? "Usage limit reached, try again later." : err.code === "not_granted" ? "Claude access is off for this page. Turn it on in the page's Permissions menu." : "Coach couldn't reply (" + (err.message||err.code) + ").", true);
  }
  S.chatBusy = false; S.chatDraft = ""; render();
  if (rewrite) { const keepTab = S.tab; await generate(w, null, rewrite); S.tab = keepTab; render(); }
}

  ${sh.note?`<p class="muted" style="margin:0">${esc(sh.note)}</p>`:""}

  <div class="shoplist">${sh.sections.map(a => `<div class="aisle"><h3>${esc(a.aisle)}</h3>${a.items.map(it => `<label class="item ${checked[it.id]?"got":""}"><input type="checkbox" data-shop="${esc(it.id)}" ${checked[it.id]?"checked":""}><span class="nm"><a href="${sainsUrl(it.search||it.name)}" target="_blank" rel="noopener">${esc(it.name)}</a><small>${esc(it.qty||"")}${it.for && it.for!=="both"?` · ${esc(it.for)}`:""}</small></span><span class="pr">£${(+it.price||0).toFixed(2)}</span></label>`).join("")}</div>`).join("")}</div>
  ${sh.tips?.length?`<section class="coachnote"><span class="label">Saving tips</span><ul class="changes">${sh.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`:""}`;
}
async function buildShopping(){
  if (S.busy || !S.sample) return;
  const budget = +($("#shBudget")?.value) || 70; S.shopBudget = budget;
  const lines = ["p1","p2"].filter(w => S.plans[w]).map(w => { const p = S.people[w];
    return `${p.name} (avoid: ${p.avoid||"nothing"}):\n` + (S.plans[w].meals||[]).map(d => `${d.day}: ` + d.meals.map(m => `${m.name}${m.shared?" [shared dinner, cooked once for both]":""} [${m.items||""}]`).join(" | ")).join("\n"); }).join("\n\n");
  S.busy = "Building your Sainsbury's list…"; S.status = ""; render();
  try {
    const r = await S.sample.json(`You are doing the weekly food shop at Sainsbury's (UK) for a couple. Build ONE combined shopping list covering every meal below for 7 days.
- Merge duplicates across both people; shared dinners are cooked once, so buy them once at combined portions.
- Use real Sainsbury's pack sizes and own-brand / good-value options ("by Sainsbury's", Stamford Street, frozen and tinned where sensible). Prefer packs that get used up across the week.
- Leave out basic cupboard items most homes have (salt, pepper, oil, stock cubes) unless a lot is needed; put them in a final "Check the cupboard" aisle with price 0.
- Price each line with a realistic current Sainsbury's estimate in GBP. Weekly budget: £${budget}. If the total would exceed it, swap to cheaper options and say what you swapped in "note".
- Respect each person's foods to avoid.

MEAL PLANS
${lines}

Reply with ONLY JSON:
{"total": number, "note": "one or two sentences: how it fits the budget and any swaps", "sections": [{"aisle": "Fruit & veg | Meat & fish | Dairy & eggs | Bakery | Frozen | Tins, jars & dried | Snacks & drinks | Check the cupboard", "items": [{"name": "Sainsbury's Chicken Thighs Boneless", "search": "short search term", "qty": "2 × 500g (Mon, Wed dinners)", "price": 3.50, "for": "both|<name>"}]}], "tips": ["2-3 short money-saving tips for this list, e.g. Nectar prices or yellow-sticker swaps"]}`, {modelTier:"default", cache:false, onText: ({text}) => { const n=text.length; if (n - S.stream > 300) { S.stream = n; const el=document.querySelector(".working .num"); if (el) el.textContent = n.toLocaleString()+" chars"; } }});
    if (!r || !Array.isArray(r.sections)) throw {code:"invalid_json"};
    let id = 0; r.sections.forEach(a => (a.items||[]).forEach(it => it.id = "i" + (id++)));
    r.total = +r.total || r.sections.flatMap(a=>a.items).reduce((t,it)=>t+(+it.price||0),0);
    const doc = {...r, budget, checked:{}, createdAt:new Date().toISOString()};
    await S.db.doc("shopping/current").set(doc); S.shopping = doc;
    S.busy = null; S.stream = 0; render();
  } catch(err){ S.busy = null; S.stream = 0; setStatus(err.code === "rate_limited" ? "Usage limit reached, try again later." : "Couldn't build the list (" + (err.message||err.code) + "). Try again.", true); }
}
async function tickShop(id, val){
  const checked = Object.assign({}, S.shopping.checked||{}, {[id]: val}); S.shopping.checked = checked; render();
  try { await S.db.doc("shopping/current").update({checked}); } catch(e){ setStatus("Couldn't save that tick.", true); }
}
async function copyShop(){
  const sh = S.shopping; const txt = "Sainsbury's list (est. £" + (+sh.total).toFixed(2) + ")\n" + sh.sections.map(a => "\n" + a.aisle.toUpperCase() + "\n" + a.items.map(it => `- ${it.name} (${it.qty||""}) £${(+it.price||0).toFixed(2)}`).join("\n")).join("\n");
  try { await navigator.clipboard.writeText(txt); setStatus("List copied. Paste it into your notes app."); } catch(e){ setStatus("Couldn't copy automatically on this device.", true); }
}

/* ---------- exercise tutorials ---------- */
const slug = n => String(n).toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,90) || "exercise";
const ytUrl = (n, extra) => "https://www.youtube.com/results?search_query=" + encodeURIComponent(`how to ${n} ${extra || "proper form tutorial"}`);
function howtoBody(name){
  const h = S.howto[slug(name)];
  const vids = `<div class="vids exbtns"><a class="vid" href="${ytUrl(name)}" target="_blank" rel="noopener">▶ Form tutorial videos</a><a href="${ytUrl(name,"common mistakes")}" target="_blank" rel="noopener">▶ Common mistakes</a><a href="${ytUrl(name,"beginner")}" target="_blank" rel="noopener">▶ Beginner version</a></div>`;
  if (!h) return S.howtoReq[slug(name)] === "failed" ? `<p class="muted">Couldn't load the guide. Close and try again, or use the videos below.</p>${vids}` : S.sample === null ? vids : `<div class="working"><span class="spinner"></span>Writing the guide…</div>${vids}`;
  const li = a => (a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  return `<div class="howto">
    ${h.muscles?`<p class="muted" style="font-size:13px">Works: ${esc(h.muscles)}</p>`:""}
    <h4>Setup</h4><p>${esc(h.setup)}</p>
    <h4>Steps</h4><ol>${li(h.steps)}</ol>
    <h4>Form cues</h4><ul>${li(h.cues)}</ul>
    <h4>Common mistakes</h4><ul>${li(h.mistakes)}</ul>
    ${h.breathing?`<h4>Breathing</h4><p>${esc(h.breathing)}</p>`:""}
    <h4>Make it easier / harder</h4><ul>${h.easier?`<li><b>Easier:</b> ${esc(h.easier)}</li>`:""}${h.harder?`<li><b>Harder:</b> ${esc(h.harder)}</li>`:""}</ul>
    ${h.safety?`<h4>Safety</h4><p>${esc(h.safety)}</p>`:""}
    ${vids}</div>`;
}
async function openHowto(key, name){
  S.openEx = S.openEx === key ? null : key; render();
  const k = slug(name);
  if (!S.openEx || S.howto[k] || S.howtoReq[k] === "busy" || !S.sample) return;
  S.howtoReq[k] = "busy";
  try {
    const h = await S.sample.json(`You are an expert strength coach. Write a clear, accurate technique guide for the exercise "${name}" for a gym-goer. Plain English, short lines. Reply with ONLY JSON:
{"muscles":"main muscles worked","setup":"1-2 sentences: equipment, stance, grip","steps":["4-6 numbered movement steps"],"cues":["3-4 short form cues"],"mistakes":["3-4 common mistakes and the fix"],"breathing":"one line","easier":"a regression","harder":"a progression","safety":"one line, or empty"}`, {modelTier:"quick", cache:false});
    if (!h || !Array.isArray(h.steps)) throw {code:"invalid_json"};
    h.name = name; h.createdAt = new Date().toISOString();
    S.howto[k] = h; S.howtoReq[k] = "done";
    await S.db.doc("howto/"+k).set(h).catch(()=>{});
  } catch(err){ S.howtoReq[k] = "failed"; }
  render();
}

/* ---------- photos ---------- */
function shrink(blob, max){
  return new Promise((res, rej) => { const url = URL.createObjectURL(blob); const img = new Image();
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej({code:"encode_failed"}), "image/jpeg", .85); };
    img.onerror = () => { URL.revokeObjectURL(url); rej({code:"unsupported_type", message:"That file isn't an image this browser can read"}); }; img.src = url; });
}
async function uploadPhoto(w, date, pose, file){
  if (!S.assets) throw {code:"not_granted", message:"Uploads need edit access"};
  const big = await shrink(file, 1600);          // re-encoding also strips location data
  const up = await S.assets.upload(big);
  const doc = {who:w, date, pose, asset:up.id, createdAt:new Date().toISOString()};
  await S.db.doc(`photos/${w}_${date}_${pose}`).set(doc);
  S.photos = S.photos.filter(x => !(x.who===w && x.date===date && x.pose===pose)).concat(doc);
  return await shrink(file, 1024);
}
async function deletePhoto(key){
  if (S.confirmDel !== key) { S.confirmDel = key; render(); return; }
  const ph = S.photos.find(x => `${x.who}_${x.date}_${x.pose}` === key); S.confirmDel = null;
  if (!ph) return;
  try { await S.db.doc("photos/"+key).delete(); if (S.assets) await S.assets.delete(ph.asset).catch(()=>{}); S.photos = S.photos.filter(x => x !== ph); render(); }
  catch(err){ setStatus("Couldn't delete: " + (err.message||err.code), true); }
}
function photosSection(){
  const mine = S.photos.filter(x => x.who === S.who).sort((a,b)=>a.date<b.date?-1:1);
  const pose = mine.filter(x => x.pose === S.pose);
  const first = pose[0], last = pose[pose.length-1];
  const add = S.assets ? `<div class="row"><select id="photoPose" aria-label="Pose" style="width:auto"><option value="front">Front</option><option value="side">Side</option><option value="back">Back</option></select><label class="btn" for="photoAdd" style="cursor:pointer">Add photo for today</label><input type="file" id="photoAdd" accept="image/*" hidden></div>` : `<p class="hint muted" style="margin:0">Photo uploads need edit access to this page.</p>`;
  return `<section><div class="spread"><h2>Progress photos</h2><span class="muted" style="font-size:12px">Visible to both of you</span></div>
    ${!mine.length ? `<div class="empty"><p>No photos yet. Add front, side and back shots at each check-in. Same spot, same lighting, same time of day. In a few weeks you'll see changes the scales miss.</p>${add}</div>` : `
    <div class="posepick" role="group" aria-label="Pose">${["front","side","back"].map(k=>`<button data-pose-pick="${k}" aria-pressed="${S.pose===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>
    ${first && last && first !== last ? `<div class="compare"><figure><img src="/_blob/${esc(first.asset)}" alt="${esc(S.pose)} photo ${esc(first.date)}" loading="lazy"><figcaption>Start · ${esc(fmtDate(first.date))}</figcaption></figure><figure><img src="/_blob/${esc(last.asset)}" alt="${esc(S.pose)} photo ${esc(last.date)}" loading="lazy"><figcaption>Latest · ${esc(fmtDate(last.date))}</figcaption></figure></div>` : pose.length ? `<p class="muted" style="margin:0">Add a second ${esc(S.pose)} photo on a later week to see a before/after.</p>` : `<p class="muted" style="margin:0">No ${esc(S.pose)} photos yet.</p>`}
    <div class="photos">${mine.slice().reverse().map(x => { const k = `${x.who}_${x.date}_${x.pose}`; return `<div class="photo"><img src="/_blob/${esc(x.asset)}" alt="${esc(x.pose)} ${esc(x.date)}" loading="lazy"><div class="cap"><span>${esc(fmtDate(x.date))} · ${esc(x.pose)}</span>${S.assets?`<button class="ghost" data-del="${esc(k)}">${S.confirmDel===k?"Confirm":"Delete"}</button>`:""}</div></div>`; }).join("")}</div>
    ${add}`}
  </section>`;
}

function liveRender(){ if (S.busy || S.chatBusy) return; if (document.querySelector("#ciForm, #pfForm")) { renderHeader(); return; } render(); }
/* ---------- boot ---------- */
render();
const loadTimer = setTimeout(() => { if (!S.loaded) { S.loaded = true; $("#syncState").textContent = "Offline"; render(); } }, 10000);
(async () => {
  const claudeApi = window.claude;
  if (!claudeApi || !claudeApi.use) { clearTimeout(loadTimer); S.loaded = true; S.sample = null; $("#syncState").textContent = "Preview only"; render(); return; }
  claudeApi.use("sample").then(s => { S.sample = s; if (S.loaded) render(); });
  claudeApi.use("assets").then(a => { S.assets = a; if (S.loaded) render(); });
  const db = await claudeApi.use("db");
  if (!db) { clearTimeout(loadTimer); S.loaded = true; $("#syncState").textContent = "Not signed in"; render(); return; }
  S.db = db;
  let got = 0; const ready = () => { if (++got >= 3) { clearTimeout(loadTimer); S.loaded = true; $("#syncState").textContent = "Synced"; } };
  const onErr = err => { $("#syncState").textContent = "Sync problem"; console.warn(err); };
  let first = [true,true,true];
  db.collection("people").onSnapshot(q => { S.people = {}; q.docs.forEach(d => S.people[d.id] = structuredClone(d.data())); if (first[0]) { first[0]=false; ready(); } liveRender(); }, onErr);
  db.collection("plans").onSnapshot(q => { S.plans = {}; q.docs.forEach(d => S.plans[d.id] = structuredClone(d.data())); if (first[1]) { first[1]=false; ready(); } liveRender(); }, onErr);
  db.collection("chat").onSnapshot(q => { S.chat = q.docs.map(d => structuredClone(d.data())); liveRender(); }, onErr);
  db.collection("photos").onSnapshot(q => { S.photos = q.docs.map(d => structuredClone(d.data())); liveRender(); }, onErr);
  db.collection("drafts").onSnapshot(q => { S.drafts = {}; q.docs.forEach(d => S.drafts[d.id] = structuredClone(d.data())); liveRender(); }, onErr);
  db.doc("shopping/current").onSnapshot(d => { S.shopping = d.exists ? structuredClone(d.data()) : null; liveRender(); }, onErr);
  db.collection("howto").onSnapshot(q => { q.docs.forEach(d => S.howto[d.id] = structuredClone(d.data())); liveRender(); }, onErr);
  db.collection("daily").onSnapshot(q => { S.daily = {}; q.docs.forEach(d => S.daily[d.id] = structuredClone(d.data())); S.dailyLoaded = true; liveRender(); }, onErr);
  db.collection("checkins").onSnapshot(q => { S.checkins = q.docs.map(d => structuredClone(d.data())); if (first[2]) { first[2]=false; ready(); } liveRender(); }, onErr);
})();
})();
</script>
